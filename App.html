<!DOCTYPE html>
<html><head><base target="_top"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{--ink:#1b2540;--paper:#f4f5f8;--card:#fff;--rule:#dfe3ec;--mu:#5d6678;--g:#1b7f4b;--r:#c0392b;--o:#d9822b;--b:#2563a8;--gold:#b88a2e}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}body{margin:0;font:14px/1.5 "Segoe UI",system-ui,Arial,sans-serif;color:var(--ink);background:var(--paper)}
#side{position:fixed;inset:0 auto 0 0;width:214px;background:var(--ink);color:#fff;padding:18px 10px;overflow:auto}
#side h1{font-size:15px;margin:0 8px 2px}#side small{display:block;margin:0 8px 18px;color:#aab4cc;font-size:12px}
#side a{display:block;padding:9px 12px;margin-bottom:2px;border-radius:6px;color:#c6cee2;cursor:pointer}
#side a:hover{background:rgba(255,255,255,.08);color:#fff}#side a.on{background:rgba(255,255,255,.14);color:#fff;box-shadow:inset 3px 0 0 var(--gold)}
#main{margin-left:214px}#top{display:flex;align-items:center;gap:12px;padding:10px 26px;background:var(--card);border-bottom:1px solid var(--rule);position:sticky;top:0;z-index:5}
#top h2{margin:0;font-size:18px;flex:1}#who{font-size:12px;color:var(--mu);text-align:right}
#view{padding:22px 26px 60px;max-width:1280px}
button{font:inherit;padding:8px 16px;border-radius:5px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
button.p{background:var(--ink);color:#fff}button.s{padding:4px 10px;font-size:12px}button:disabled{opacity:.45;cursor:not-allowed}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--b);outline-offset:2px}
.card{background:var(--card);border:1px solid var(--rule);border-radius:6px;padding:16px 18px;margin-bottom:16px}
.card h3{margin:0 0 10px;font-size:15px}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:16px}
.k{background:var(--card);border:1px solid var(--rule);border-left:4px solid var(--ink);border-radius:6px;padding:10px 14px}
.k span{font-size:12px;color:var(--mu)}.k b{display:block;font-size:21px;font-variant-numeric:tabular-nums}
.k.g{border-left-color:var(--g)}.k.g b{color:var(--g)}.k.r{border-left-color:var(--r)}.k.r b{color:var(--r)}.k.b{border-left-color:var(--b)}.k.b b{color:var(--b)}.k.o{border-left-color:var(--o)}.k.o b{color:var(--o)}
table{width:100%;border-collapse:collapse}th,td{padding:7px 10px;border-bottom:1px solid var(--rule);text-align:left;white-space:nowrap;font-variant-numeric:tabular-nums}
th{font-size:12px;color:var(--mu);font-weight:600;background:#fafbfd;position:sticky;top:0}.sc{overflow:auto;max-height:68vh}
td.n,th.n{text-align:right}.pl{padding:2px 9px;border-radius:10px;color:#fff;font-size:11px;font-weight:600}
.PAID{background:var(--g)}.PARTIAL{background:var(--o)}.UNPAID{background:var(--r)}.ADVANCE{background:var(--b)}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:3px}
input,select{width:100%;padding:8px 10px;font:inherit;border:1px solid #b9c0cf;border-radius:4px;background:#fff;color:var(--ink)}input[readonly]{background:var(--paper)}
.bars{display:flex;align-items:flex-end;gap:14px;height:130px;padding-top:8px}.bars div{flex:1;text-align:center;font-size:12px;color:var(--mu)}
.bars i{display:block;background:var(--g);border-radius:3px 3px 0 0;margin-bottom:4px}
.msg{padding:9px 12px;border-radius:4px;margin:10px 0;font-size:13px}.err{background:#fbeae8;color:#8a2a20;border:1px solid #e6b3ad}.warn{background:#fdf1e2;color:#7a4a0c;border:1px solid #efcf9f}.ok{background:#e4f4ea;color:#14532d;border:1px solid #a9d8bc}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row>*{flex:0 0 auto}.mu{color:var(--mu)}.g{color:var(--g)}.r{color:var(--r)}
#modal{position:fixed;inset:0;background:rgba(27,37,64,.55);display:none;align-items:flex-start;justify-content:center;overflow:auto;padding:24px;z-index:20}
#mbox{background:#fff;border-radius:6px;max-width:740px;width:100%}.mbar{display:flex;gap:8px;padding:10px 14px;background:var(--ink);border-radius:6px 6px 0 0}
#toast{position:fixed;right:18px;bottom:18px;background:var(--ink);color:#fff;padding:10px 16px;border-radius:5px;display:none;z-index:30;max-width:360px}
@media(max-width:780px){
#side{position:sticky;inset:0 0 auto 0;width:auto;z-index:8;padding:6px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch}
#side h1,#side small{display:none}
#nav{display:flex;gap:4px}
#side a{flex:0 0 auto;white-space:nowrap;margin:0;padding:11px 14px}
#side a.on{box-shadow:inset 0 -3px 0 var(--gold)}
#main{margin-left:0}
#top{position:static;flex-wrap:wrap;gap:8px;padding:10px 12px}
#top h2{font-size:17px;flex:1 1 auto;min-width:0}
#rf{padding:8px 12px;font-size:13px;min-height:40px}
#who{order:3;flex:1 1 100%;text-align:left}
#view{padding:12px 12px 80px}
.card{padding:12px;margin-bottom:12px}
.kp{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.k{padding:8px 10px}.k b{font-size:17px}
.fg{grid-template-columns:1fr}
input:not([type=checkbox]),select{font-size:16px;min-height:44px}
button{min-height:44px}button.s{min-height:36px;padding:6px 12px}
#sv{flex:1 1 100%}
th,td{padding:8px}
.sc{max-height:62vh;-webkit-overflow-scrolling:touch}
.sc th:first-child{position:sticky;left:0;z-index:3;background:#fafbfd}
.sc td:first-child{position:sticky;left:0;z-index:1;background:#fff;box-shadow:1px 0 0 var(--rule)}
.bars{overflow-x:auto;gap:10px}.bars div{min-width:64px}
#modal{padding:8px}.mbar{flex-wrap:wrap}
#toast{left:12px;right:12px;bottom:12px;max-width:none}
}
.dw{border-bottom:1px solid var(--rule)}.dw:last-child{border-bottom:0}
.due{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 0}.due .dn{flex:1 1 150px;min-width:0}
.due .da{text-align:right;min-width:92px;font-variant-numeric:tabular-nums}.due .da small{display:block;font-size:11px;color:var(--mu);font-weight:400}
@media(max-width:780px){.due .dn{flex-basis:100%}.due .da{text-align:left}.due button{margin-left:auto}.dd .fg{grid-template-columns:repeat(2,minmax(0,1fr))}}

.dc{border-top:4px solid var(--r);background:linear-gradient(180deg,#fff7f6 0,#fff 90px)}
.dh{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.dt{display:flex;align-items:center;gap:12px}.dt h3{margin:0}.dt small{font-size:12px}
.dbell{width:34px;height:34px;border-radius:50%;background:var(--r);color:#fff;display:grid;place-items:center;font-weight:800;animation:pulse 2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(192,57,43,.45)}70%{box-shadow:0 0 0 10px rgba(192,57,43,0)}100%{box-shadow:0 0 0 0 rgba(192,57,43,0)}}
.dchips{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:4px 12px;border-radius:14px;background:var(--paper);border:1px solid var(--rule);font-size:12px;font-weight:600}
.chip.red{background:var(--r);border-color:var(--r);color:#fff;font-size:13px}
.dtools{display:flex;gap:10px;margin-bottom:10px}.dtools input{flex:1}.dtools select{width:auto;min-width:140px}
.dw{border:1px solid var(--rule);border-left:4px solid var(--r);border-radius:8px;margin-bottom:10px;background:#fff;transition:box-shadow .2s,transform .2s}
.dw:last-child{border-bottom:1px solid var(--rule)}
.dw:hover{box-shadow:0 6px 18px rgba(27,37,64,.12);transform:translateY(-2px)}
.dw.open{box-shadow:0 6px 18px rgba(27,37,64,.12)}
.due{padding:12px 14px;cursor:pointer;border-radius:8px}
.av{width:42px;height:42px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex:0 0 auto}
.due .dn b{font-size:15px}.sub{font-size:12px;color:var(--mu);margin:2px 0 6px}
.pb{height:7px;background:var(--rule);border-radius:4px;overflow:hidden;max-width:260px}
.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--o),var(--g));border-radius:4px;transition:width .6s}
.pbt{font-size:11px;color:var(--mu)}
.due .da b{font-size:18px}
.acts{display:flex;gap:6px;align-items:center}
.acts a{display:inline-grid;place-items:center;padding:6px 11px;border-radius:5px;font-size:12px;font-weight:600;text-decoration:none;border:1px solid var(--rule);color:var(--ink);background:#fff}
.acts a:hover{background:var(--paper)}.acts a.wa{background:#25d366;border-color:#25d366;color:#fff}.acts a.wa:hover{filter:brightness(.93)}
.chev{display:inline-block;transition:transform .25s}.dw.open .chev{transform:rotate(180deg)}
.dw .dd{display:none;padding:0 14px 8px}.dw.open .dd{display:block;animation:fd .25s}
@keyframes fd{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.dok{display:flex;align-items:center;gap:14px;border-left:4px solid var(--g);background:#f1faf5}
.dok-i{width:38px;height:38px;border-radius:50%;background:var(--g);color:#fff;display:grid;place-items:center;font-size:20px}
@media(max-width:780px){.acts{flex:1 1 100%}.acts a{min-height:40px;flex:1}.dtools{flex-wrap:wrap}.dtools select{width:100%}.pb{max-width:none}}

.cb{position:relative}
.cb input{padding-right:42px}
.cbx{position:absolute;right:1px;bottom:1px;width:40px;height:38px;min-height:0;padding:0;border:0;border-left:1px solid var(--rule);border-radius:0 4px 4px 0;background:var(--paper);font-size:16px;cursor:pointer}
.cl{display:none;position:absolute;left:0;right:0;top:100%;margin-top:2px;max-height:240px;overflow:auto;background:#fff;border:1px solid #b9c0cf;border-radius:4px;box-shadow:0 8px 20px rgba(27,37,64,.18);z-index:15}
.co{padding:11px 12px;cursor:pointer;border-bottom:1px solid var(--rule)}.co:last-child{border-bottom:0}
.co:hover{background:var(--paper)}.co span{float:right;font-size:12px}
@media(max-width:780px){.cbx{height:42px;width:44px}}

.dtools .cb{flex:1;min-width:0}.dtools .cb input{width:100%}
@media(max-width:780px){.dtools .cb{flex:1 1 100%}}

.stm{padding:20px 22px}.stm h2{font-size:20px;margin:0}.stm h4{margin:18px 0 6px;font-size:13px}
.stm .sh{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-bottom:10px;border-bottom:2px solid var(--ink);margin-bottom:12px}
.stm .ov{overflow-x:auto}.stm table{font-size:12.5px}
.stm tfoot td{font-weight:700;background:#fafbfd;border-top:2px solid var(--ink)}
.stm .ft{margin-top:18px;font-size:11px;color:var(--mu);text-align:center}
@media print{.stm{padding:0}.stm .ov{overflow:visible}.stm thead{display:table-header-group}.stm tr{page-break-inside:avoid}.k,.pl{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

@media print{body>*:not(#modal){display:none!important}#modal{position:static;background:none;padding:0;display:block!important}.mbar{display:none}}
</style></head><body>
<nav id="side" aria-label="Main"><h1>Rent Payment</h1><small id="biz"></small><div id="nav"></div></nav>
<div id="main"><div id="top"><h2 id="title"></h2><button id="rf">Refresh system</button><div id="who"></div></div><div id="view">Loading…</div></div>
<div id="modal"><div id="mbox"><div class="mbar"><button class="p" id="mp" style="border-color:#fff">Print</button><button id="md" style="background:transparent;color:#fff;border-color:#fff">Download PDF</button><button id="mc" style="background:transparent;color:#fff;border-color:#fff">Close</button></div><div id="mb"></div></div></div>
<div id="toast" role="status"></div>
<script>
var $=function(i){return document.getElementById(i)},U={},cur='',E=function(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})};
function api(fn){var a=[].slice.call(arguments,1);return new Promise(function(ok,no){google.script.run.withSuccessHandler(ok).withFailureHandler(no)[fn](...a)})}
function inr(n){n=Number(n)||0;return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:n%1?2:0,maximumFractionDigits:2})}
function toast(m){var t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(t._t);t._t=setTimeout(function(){t.style.display='none'},4500)}
function fail(e){toast(e&&e.message?e.message:String(e))}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pill(s){return '<span class="pl '+E(s)+'">'+E(s)+'</span>'}
var PAGES=[['dash','Dashboard'],['pay','New payment'],['rec','Receipts'],['log','Rent log'],['ledger','Rent ledger'],['stmt','Statement'],['history','Rent history'],['rev','Revisions',1],['set','Settings',1]];
function nav(){$('nav').innerHTML=PAGES.filter(function(p){return !p[2]||U.admin}).map(function(p){return '<a tabindex="0" data-p="'+p[0]+'" class="'+(p[0]===cur?'on':'')+'">'+p[1]+'</a>'}).join('');
 [].forEach.call($('nav').children,function(a){a.onclick=function(){go(a.dataset.p)};a.onkeydown=function(e){if(e.key==='Enter')go(a.dataset.p)}});var on=$('nav').querySelector('.on');if(on&&on.scrollIntoView)on.scrollIntoView({inline:'center',block:'nearest'})}
function go(p){cur=p;nav();$('title').textContent=PAGES.filter(function(x){return x[0]===p})[0][1];$('view').innerHTML='<div class="mu">Loading…</div>';
 ({dash:vDash,pay:vPay,rec:vRec,log:function(){vTable('log')},ledger:function(){vTable('ledger')},stmt:vStmt,history:function(){vTable('history')},rev:vRev,set:vSet})[p]().catch(function(e){$('view').innerHTML='<div class="msg err">'+E(e.message||e)+'</div>'})}
$('rf').onclick=function(){var b=$('rf');b.disabled=true;b.textContent='Refreshing…';api('refreshSystem').then(function(r){toast('Refreshed. Ledger rows: '+r.ledgerRows+(r.pending?'. '+r.pending+' revision(s) need review.':''));go(cur)}).catch(fail).then(function(){b.disabled=false;b.textContent='Refresh system'})};

function tbl(h,rows,nums){return '<div class="sc"><table><thead><tr>'+h.map(function(x,i){return '<th class="'+(nums&&nums.indexOf(i)>=0?'n':'')+'">'+E(x)+'</th>'}).join('')+'</tr></thead><tbody>'+(rows.length?rows.join(''):'<tr><td colspan="'+h.length+'" class="mu">Nothing to show yet.</td></tr>')+'</tbody></table></div>'}
function vDash(){return api('getDashboardData',{}).then(function(d){var k=d.kpis,c=d.charts.monthlyCollection,mx=Math.max.apply(null,c.map(function(x){return x.amount}).concat([1]));
 $('view').innerHTML='<div class="kp"><div class="k"><span>Active tenants</span><b>'+k.activeTenants+'</b></div><div class="k"><span>Expected rent</span><b>'+inr(k.expected)+'</b></div><div class="k g"><span>Rent received</span><b>'+inr(k.received)+'</b></div><div class="k r"><span>Outstanding</span><b>'+inr(k.outstanding)+'</b></div><div class="k b"><span>Advance credit</span><b>'+inr(k.advance)+'</b></div><div class="k g"><span>Fully paid</span><b>'+k.paid+'</b></div><div class="k o"><span>Partial</span><b>'+k.partial+'</b></div><div class="k r"><span>Unpaid</span><b>'+k.unpaid+'</b></div></div>'+
 dueCard(d.tenants)+'<div class="card"><h3>Collected by month</h3><div class="bars">'+(c.length?c.map(function(x){return '<div><i style="height:'+Math.max(4,Math.round(x.amount/mx*100))+'px"></i>'+E(x.month)+'<br><b>'+inr(x.amount)+'</b></div>'}).join(''):'<span class="mu">No payments yet.</span>')+'</div></div>'+
 '<div class="card"><h3>Tenants</h3>'+tbl(['Tenant','Phone','Rent','Previous due','Total due','Received','Balance','Advance','Status','Last payment','Agreement end'],d.tenants.map(function(t){return '<tr><td>'+E(t.name)+'</td><td>'+E(t.phone)+'</td><td class="n">'+inr(t.agreementRent)+'</td><td class="n">'+inr(t.previousOutstanding)+'</td><td class="n">'+inr(t.totalDue)+'</td><td class="n g">'+inr(t.totalReceived)+'</td><td class="n '+(t.remaining>0?'r':'')+'">'+inr(t.remaining)+'</td><td class="n">'+inr(t.advance)+'</td><td>'+pill(t.status)+'</td><td>'+E(t.lastPaymentDate)+'</td><td>'+E(t.agreementEnd)+'</td></tr>'}),[2,3,4,5,6,7])+'</div>'+
 '<div class="card"><h3>Recent payments</h3>'+tbl(['Receipt','Date','Tenant','Amount','Settled','Remaining','Status'],d.transactions.slice(0,15).map(function(x){return '<tr><td>'+E(x.receiptId)+'</td><td>'+E(x.date)+'</td><td>'+E(x.tenant)+'</td><td class="n g">'+inr(x.amount)+'</td><td>'+E(x.allocation)+'</td><td class="n">'+inr(x.remaining)+'</td><td>'+pill(x.status)+'</td></tr>'}),[3,5])+'</div>';wireDue(d.tenants)})}

/* Dashboard: tenants who still owe rent. Name, due amount, agreement rent; View details expands full information. */
function dueRows(L,q,s){q=(q||'').toLowerCase();
 var R=L.filter(function(t){return !q||String(t.name).toLowerCase().indexOf(q)>=0}).sort(function(a,b){return s==='name'?String(a.name).localeCompare(String(b.name)):b.remaining-a.remaining});
 if(!R.length)return '<div class="mu" style="padding:10px">No tenant matches.</div>';
 return R.map(function(t){
  var ini=String(t.name||'?').trim().split(/\s+/).slice(0,2).map(function(w){return w[0]}).join('').toUpperCase();
  var pct=t.totalDue>0?Math.max(0,Math.min(100,Math.round((t.totalReceived||0)/t.totalDue*100))):0;
  var ph=String(t.phone||'').replace(/\D/g,''),wn=ph.length===10?'91'+ph:ph;
  var msg=encodeURIComponent('Hello '+t.name+', this is a gentle reminder that rent of '+inr(t.remaining)+' is pending. Kindly pay at the earliest. Thank you.');
  return '<div class="dw" data-tid="'+E(t.tid)+'"><div class="due" tabindex="0" role="button" aria-expanded="false">'+
  '<div class="av">'+E(ini)+'</div>'+
  '<div class="dn"><b>'+E(t.name)+'</b><div class="sub">'+(t.phone?E(t.phone)+' · ':'')+pill(t.status)+'</div><div class="pb"><i style="width:'+pct+'%"></i></div><span class="pbt">'+pct+'% of total due paid</span></div>'+
  '<div class="da"><b class="r">'+inr(t.remaining)+'</b><small>Due</small></div>'+
  '<div class="da"><b>'+inr(t.agreementRent)+'</b><small>Agreement</small></div>'+
  '<div class="acts">'+(ph?'<a href="tel:+'+E(wn)+'">Call</a><a class="wa" target="_blank" rel="noopener" href="https://wa.me/'+E(wn)+'?text='+msg+'">WhatsApp</a>':'')+'<button class="s">Details <span class="chev">▾</span></button></div>'+
  '</div><div class="dd"></div></div>'}).join('')}
function dueCard(T){var L=T.filter(function(t){return t.remaining>0}),tot=L.reduce(function(s,t){return s+t.remaining},0);
 if(!L.length)return '<div class="card dok"><div class="dok-i">✓</div><div><b>All clear</b><div class="mu">No pending dues. Every tenant is paid up.</div></div></div>';
 return '<div class="card dc"><div class="dh"><div class="dt"><span class="dbell">!</span><div><h3>Dues pending</h3><small class="mu">Tap a tenant to see full details</small></div></div><div class="dchips"><span class="chip">'+L.length+' tenant'+(L.length>1?'s':'')+'</span><span class="chip red">'+inr(tot)+' to collect</span></div></div>'+
 '<div class="dtools"><div class="cb"><input id="dq" autocomplete="off" placeholder="Search or select tenant"><button type="button" class="cbx" id="dx" aria-label="Show tenants">▾</button><div class="cl" id="dcl"></div></div><select id="ds"><option value="due">Highest due first</option><option value="name">Name A–Z</option></select></div><div id="dl">'+dueRows(L,'','due')+'</div></div>'}
var LC=null;
function ledgerAndLog(){return LC||(LC=Promise.all([api('webTable','ledger'),api('webTable','log')]))}
function wireDue(T){LC=null;var dl=$('dl');if(!dl)return;var by={};T.forEach(function(t){by[t.tid]=t});
 var L=T.filter(function(t){return t.remaining>0});
 function draw(){dl.innerHTML=dueRows(L,$('dq').value,$('ds').value)}
 function cl(q){q=(q||'').toLowerCase();var m=L.filter(function(t){return !q||String(t.name).toLowerCase().indexOf(q)>=0});
  $('dcl').innerHTML=(q?'':'<div class="co" data-n=""><b>All tenants</b></div>')+(m.length?m.map(function(t){return '<div class="co" data-n="'+E(t.name)+'">'+E(t.name)+'<span class="r">'+inr(t.remaining)+'</span></div>'}).join(''):'<div class="co mu">No match</div>')}
 function opn(v){$('dcl').style.display=v?'block':'none'}
 $('dq').oninput=function(){draw();cl($('dq').value);opn(true)};
 $('dq').onfocus=function(){cl($('dq').value);opn(true)};
 $('dx').onclick=function(){if($('dcl').style.display==='block'){opn(false)}else{cl('');opn(true)}};
 $('dcl').onclick=function(e){var o=e.target.closest('.co');if(!o||o.dataset.n===undefined)return;$('dq').value=o.dataset.n;draw();opn(false)};
