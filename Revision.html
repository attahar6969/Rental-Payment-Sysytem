<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{--ink:#1f2a44;--rule:#d9dde5;--wash:#f3f5f9;--orange:#d9822b;--red:#c0392b;--green:#1b7f4b}
  body{margin:0;padding:16px 20px;font:14px/1.45 'IBM Plex Sans',Arial,sans-serif;color:var(--ink)}
  .card{border:1px solid var(--rule);border-left:5px solid var(--orange);border-radius:3px;padding:12px 14px;margin-bottom:12px}
  .card h3{margin:0 0 2px;font-size:15px}
  .meta{color:#5d6678;font-size:12px}
  .chg{margin:8px 0;font-size:15px}
  .chg b{font-variant-numeric:tabular-nums}
  .row{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-top:8px}
  label{display:block;font-size:12px;color:#5d6678}
  input[type=date]{padding:7px 9px;font:inherit;border:1px solid #b9c0cf;border-radius:4px}
  button{font:inherit;padding:8px 14px;border-radius:4px;border:1px solid var(--ink);background:#fff;color:var(--ink);cursor:pointer}
  button.p{background:var(--ink);color:#fff}
  .note{margin-top:8px;padding:8px 10px;border-radius:4px;font-size:13px}
  .warn{background:#fdf1e2;border:1px solid #efcf9f;color:#7a4a0c}
  .err{background:#fbeae8;border:1px solid #e6b3ad;color:#8a2a20}
  .ok{background:#e4f4ea;border:1px solid #a9d8bc;color:#14532d}
  .empty{padding:30px 0;color:#5d6678}
  .chk{display:flex;gap:8px;align-items:center;margin-top:8px}
</style>
</head>
<body>
<div id="list"><div class="empty">Loading…</div></div>
<script>
function inr(n){n=Number(n)||0;return '₹'+n.toLocaleString('en-IN',{minimumFractionDigits:(n%1?2:0),maximumFractionDigits:2});}
function pretty(s){if(!s)return '';var p=s.split('-');return p[2]+'-'+['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][+p[1]-1]+'-'+p[0];}
var TYPES={RENT_REVISION:'Rent changed',NEW_AGREEMENT:'New agreement / renewal',END_DATE_CHANGE:'Agreement end date changed'};
function el(t,c,txt){var e=document.createElement(t);if(c)e.className=c;if(txt!==undefined)e.textContent=txt;return e;}
function load(){google.script.run.withSuccessHandler(render).withFailureHandler(function(e){document.getElementById('list').textContent=e.message||e;}).getPendingRevisions();}
function render(items){
  var L=document.getElementById('list'); L.innerHTML='';
  if(!items.length){L.appendChild(el('div','empty','Nothing is waiting for review. Every agreement matches its recorded terms.'));return;}
  items.forEach(function(it){
    var c=el('div','card'); c.appendChild(el('h3','',it.name+' ('+it.tid+')')); c.appendChild(el('div','meta',it.property.slice(0,80)));
    c.appendChild(el('div','meta',TYPES[it.type]||it.type));
    var chg=el('div','chg'); chg.textContent=(it.prev!==null?inr(it.prev)+'  →  ':'')+inr(it.rent)+' per month · agreement '+pretty(it.start)+' to '+pretty(it.end); c.appendChild(chg);
    var msg=el('div','note'); msg.style.display='none';
    if(!it.isAdmin){ c.appendChild(el('div','note warn','Only an administrator can confirm this change.')); L.appendChild(c); return; }
    var row=el('div','row'), date=el('input'); date.type='date'; date.value=it.suggested||'';
    if(it.type!=='END_DATE_CHANGE'){var w=el('div'); w.appendChild(el('label','','Effective from (the first day the new terms apply)')); w.appendChild(date); row.appendChild(w);}
    var chkWrap=el('label','chk'); chkWrap.style.display='none'; var chk=el('input'); chk.type='checkbox'; chkWrap.appendChild(chk); chkWrap.appendChild(document.createTextNode(' I confirm this past-dated change should recalculate the ledger'));
    var ok=el('button','p','Confirm change'), no=el('button','','Reject');
    ok.onclick=function(){
      ok.disabled=no.disabled=true;
      google.script.run.withSuccessHandler(function(r){
        if(r.ok){c.textContent='';c.className='note ok';c.textContent=it.name+': change recorded. Ledger rebuilt.';return;}
        ok.disabled=no.disabled=false; msg.style.display='block';
        if(r.needsConfirm){msg.className='note warn';chkWrap.style.display='flex';} else msg.className='note err';
        msg.textContent=r.message;
      }).withFailureHandler(function(e){ok.disabled=no.disabled=false;msg.style.display='block';msg.className='note err';msg.textContent=e.message||e;})
      .recordRentRevision(it.ref,date.value,chk.checked);
    };
    no.onclick=function(){ if(!confirm('Reject this change? It will be flagged again on the next refresh unless the Parent Workbook is corrected.'))return;
      ok.disabled=no.disabled=true; google.script.run.withSuccessHandler(function(r){c.textContent='';c.className='note ok';c.textContent='Rejected.';}).withFailureHandler(function(e){ok.disabled=no.disabled=false;alert(e.message);}).rejectRentRevision(it.ref);};
    row.appendChild(ok); row.appendChild(no); c.appendChild(row); c.appendChild(chkWrap); c.appendChild(msg); L.appendChild(c);
  });
}
load();
</script>
</body>
</html>
